<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111b2e">
<title>Киберщит</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: security-operations console; sticky status bar (server integrity), one incident card at a time, debrief below */
:root{
  --bg:#0b1220;
  --panel:#111b2e;
  --panel-2:#16233a;
  --line:#22324d;
  --text:#e3e9f3;
  --muted:#8a9ab3;
  --shield:#4fd1c5;
  --alert:#ffb547;
  --breach:#ff5c7a;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:10}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-block:10px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.bar-top b{color:var(--text)}
.brand{font-weight:700;color:var(--shield)!important;letter-spacing:.04em}
.hp{height:8px;background:#0a101c;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.hp i{display:block;height:100%;background:var(--shield);transition:width .5s, background .5s}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-block:16px 32px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tag{align-self:flex-start;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:6px;border:1px solid}
.tag.defend{color:var(--alert);border-color:rgba(255,181,71,.45)}
.tag.spot{color:#9ab6ff;border-color:rgba(154,182,255,.45)}
.tag.phish{color:var(--breach);border-color:rgba(255,92,122,.45)}
h1,h2{margin:0;text-wrap:balance}
h1{font-size:20px;line-height:1.25}
h2{font-size:15px;font-family:var(--mono);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
p{margin:0}
.muted{color:var(--muted)}
.term{background:#070c16;border:1px solid var(--line);border-radius:10px;font-family:var(--mono);font-size:13px;line-height:1.55;overflow-x:auto;min-width:0}
.term pre{margin:0;padding:12px;white-space:pre}
.term .hd{font-size:11px;color:var(--muted);padding:6px 12px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.08em}
.lines{display:flex;flex-direction:column;padding:6px 0}
.ln{display:flex;gap:12px;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--text);font:inherit;padding:6px 12px;cursor:pointer;white-space:pre;min-width:max-content}
.ln span{color:#4b5d7a;user-select:none}
.ln:hover{background:rgba(154,182,255,.06)}
.ln.right{background:rgba(79,209,197,.12);border-left-color:var(--shield)}
.ln.wrong{background:rgba(255,92,122,.12);border-left-color:var(--breach)}
.mail{background:#f4f6fa;color:#1d2433;border-radius:10px;overflow:hidden;font-size:14px}
.mail .mh{padding:10px 12px;border-bottom:1px solid #d9dee8;display:grid;gap:2px;font-size:13px}
.mail .mh b{font-weight:700}
.mail .mb{padding:12px;display:flex;flex-direction:column;gap:8px}
.mail .lnk{color:#1a56db;text-decoration:underline;word-break:break-all}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px 14px;font:inherit;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:#3a5078}
.opt .k{font-family:var(--mono);font-weight:700;color:var(--muted);flex:none}
.opt.right{border-color:var(--shield);background:rgba(79,209,197,.1)}
.opt.wrong{border-color:var(--breach);background:rgba(255,92,122,.1)}
.opt:disabled{cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.verdict{border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;font-weight:700}
.verdict.ok{background:rgba(79,209,197,.12);border:1px solid var(--shield);color:var(--shield)}
.verdict.bad{background:rgba(255,92,122,.12);border:1px solid var(--breach);color:var(--breach)}
.verdict small{display:block;font-weight:400;color:var(--text)}
.deb{display:flex;flex-direction:column;gap:14px}
.deb section{display:flex;flex-direction:column;gap:6px}
.deb h3{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.h-hack{color:var(--breach)} .h-why{color:var(--alert)} .h-res{color:#c4a7ff} .h-def{color:var(--shield)}
.btn{font-family:var(--mono);font-weight:700;font-size:15px;padding:14px 18px;border-radius:10px;border:0;cursor:pointer;background:var(--shield);color:#06201d}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text)}
button:focus-visible{outline:2px solid var(--alert);outline-offset:2px}
.hero{display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:30px;font-family:var(--mono);letter-spacing:-.02em}
.hero h1 span{color:var(--shield)}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.law{border-left:3px solid var(--alert);padding:8px 12px;background:rgba(255,181,71,.07);border-radius:0 8px 8px 0;font-size:14px}
.big{font-family:var(--mono);font-size:48px;font-weight:700;line-height:1}
.recap{display:flex;flex-direction:column;gap:8px}
.recap div{display:flex;gap:10px;font-size:14px}
.recap b{font-family:var(--mono);flex:none;width:18px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.modes{display:grid;gap:10px}
.mode{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--text);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.mode b{font-family:var(--mono);font-size:16px}
.mode span{color:var(--muted);font-size:14px}
.mode.main{border-color:var(--shield)}
.back{align-self:flex-start;background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:13px;cursor:pointer;padding:4px 0}
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);font:inherit;cursor:pointer}
.task .st{font-family:var(--mono);font-weight:700;width:22px;flex:none;color:var(--muted)}
.task.done .st{color:var(--shield)}
.task small{display:block;color:var(--muted)}
.editor{position:relative;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#070c16}
.editor .hd{font-family:var(--mono);font-size:11px;color:var(--muted);padding:6px 12px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between}
textarea.code{width:100%;min-height:260px;resize:vertical;border:0;outline:0;background:transparent;color:var(--text);font-family:var(--mono);font-size:16px;line-height:1.5;padding:12px;white-space:pre;overflow:auto;tab-size:2}
.keys{display:flex;gap:6px;overflow-x:auto;padding:8px;border-top:1px solid var(--line);background:var(--panel-2)}
.keys button{flex:none;min-width:38px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-family:var(--mono);font-size:15px;cursor:pointer;padding:0 8px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.tk{font-family:var(--mono);font-size:12px;font-weight:700;color:#9ab6ff}
.tmid{min-width:0}
.pill{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-block{background:rgba(255,92,122,.2);color:var(--breach)}
.p-crit{background:rgba(255,92,122,.12);color:#ff8fa3}
.p-high{background:rgba(255,181,71,.14);color:var(--alert)}
.p-done{background:rgba(79,209,197,.14);color:var(--shield)}
.trow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
dl.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
dl.meta dt{color:var(--muted)} dl.meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--mono);font-size:13px}
h3.sub{margin:0 0 4px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
details summary{cursor:pointer;font-family:var(--mono);font-size:13px;color:var(--muted)}
ul.accept{margin:8px 0 0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.ide{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#070c16;min-width:0}
.tabs{display:flex;align-items:center;gap:10px;background:var(--panel);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;min-width:0}
.tab{padding:8px 12px;border-right:1px solid var(--line);color:var(--text);background:#070c16;border-top:2px solid var(--shield)}
.path{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ed{display:grid;grid-template-columns:auto 1fr;height:300px;min-width:0}
.gut{font-family:var(--mono);font-size:16px;line-height:1.5;color:#3d4f6b;text-align:right;padding:12px 8px 12px 10px;border-right:1px solid var(--line);user-select:none;overflow:hidden;will-change:transform}
.area{position:relative;overflow:hidden;min-width:0}
.area pre.hl,.area textarea{margin:0;font-family:var(--mono);font-size:16px;line-height:1.5;padding:12px;white-space:pre;tab-size:2;letter-spacing:0}
.area pre.hl{position:absolute;left:0;top:0;min-width:100%;pointer-events:none;color:var(--text)}
.area textarea{position:absolute;inset:0;width:100%;height:100%;resize:none;border:0;outline:0;background:transparent;color:transparent;caret-color:#fff;overflow:auto}
.area textarea::selection{background:rgba(130,170,255,.35);color:transparent}
.t-kw{color:#c792ea}.t-str{color:#c3e88d}.t-com{color:#5c7092;font-style:italic}.t-num{color:#f78c6c}
.sbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#0f2a3a;color:#9fc6d8;font-family:var(--mono);font-size:11px;padding:4px 10px}
.sbar #dirty{color:var(--alert)}
.chat{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.chat b{font-family:var(--mono);font-size:12px;color:var(--alert)}
.console{background:#05080e;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.chead{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--muted)}
.chead span:last-child{margin-left:8px}
.dot{width:10px;height:10px;border-radius:50%}.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.cbody{font-family:var(--mono);font-size:12.5px;line-height:1.6;padding:10px 12px;max-height:420px;overflow:auto}
.cl{white-space:pre-wrap;overflow-wrap:anywhere;min-height:1em}
.cl.dim{color:var(--muted)}.cl.ok{color:var(--shield)}.cl.bad{color:var(--breach)}.cl.warn{color:var(--alert)}
.pr{color:#82aaff}.pr.hk{color:var(--breach)}
.val{color:#ffd580}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.tests{display:flex;flex-direction:column;gap:6px}
.test{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:8px 10px;border-radius:8px;background:var(--panel-2)}
.test b{font-family:var(--mono);flex:none;width:18px}
.test.ok b{color:var(--shield)} .test.bad b{color:var(--breach)}
.test small{display:block;color:var(--muted)}
.errbox{color:var(--breach);font-family:var(--mono);font-size:13px;white-space:pre-wrap}
@media (prefers-reduced-motion: reduce){.shake{animation:none}.hp i{transition:none}}
</style>
</head>
<body>

<div class="bar" id="bar">
  <div class="bar-in">
    <div class="bar-top"><span class="brand">КИБЕРЩИТ</span><span>Инцидент <b id="num">0/12</b></span><span>Очки <b id="pts">0</b></span></div>
    <div class="hp" role="meter" aria-label="Защита сервера" aria-valuemin="0" aria-valuemax="100" id="hpm"><i id="hp" style="width:100%"></i></div>
  </div>
</div>

<main class="wrap" id="app"></main>

<script>
(() => {
const app = document.getElementById('app');

/* Each incident: type defend | spot | phish.
   Debrief: hack (что написал хакер), why (почему сработало), res (что будет без защиты), def (как защититься), fix (безопасный код или правило) */
const MISSIONS = [
{ type:'phish', topic:'Фишинг', title:'Письмо из «банка»',
  text:'Сотруднику пришло письмо. Это настоящее письмо или фишинг?',
  mail:{ from:'Служба безопасности <support@nadezhny-bank-security.top>', subj:'СРОЧНО: ваш счёт будет заблокирован',
    body:['Здравствуйте!','Мы заметили подозрительную активность. Если вы не подтвердите данные в течение 1 часа, счёт будет заблокирован навсегда.','Введите логин, пароль и код из СМС по ссылке:'],
    link:'http://nadezhny-bank.login-verify.top/confirm' },
  answer:'phish',
  hack:'Хакер не пишет код. Он пишет письмо, которое давит на страх и спешку, и ведёт на поддельную страницу входа.',
  why:'Домен отправителя и ссылки чужой (.top вместо адреса банка), письмо требует срочности и просит пароль и код из СМС. Настоящий банк никогда не просит сообщить их.',
  res:'Человек вводит пароль и код на поддельном сайте, хакер сразу входит в настоящий аккаунт и выводит деньги.',
  def:'Проверяй адрес отправителя и ссылки, не переходи по ссылкам из тревожных писем, заходи на сайт банка вручную или звони по номеру с карты. Включи двухфакторную защиту.',
  fix:'Правило: срочность + просьба ввести пароль = почти всегда фишинг.' },

{ type:'defend', topic:'Подбор пароля', title:'Тысячи попыток входа',
  text:'В журнале сервера за одну минуту появились тысячи попыток войти в аккаунт admin. Что сделать?',
  log:'14:02:01  login admin  pass=123456     FAIL\n14:02:01  login admin  pass=password   FAIL\n14:02:01  login admin  pass=qwerty     FAIL\n14:02:02  login admin  pass=admin2024  FAIL\n...       ещё 4 812 попыток за 60 секунд',
  opts:[
    ['Ограничить число попыток, добавить задержку или капчу и включить двухфакторный вход', true],
    ['Убрать кнопку «Войти» с главной страницы', false],
    ['Перезагрузить сервер', false],
    ['Написать в журнале «хакерам вход запрещён»', false] ],
  hack:'Программа-перебор (брутфорс) подставляет пароли из списка самых популярных: 123456, qwerty, password…',
  why:'Сервер разрешает бесконечно пробовать пароли, а у админа слабый пароль из словаря.',
  res:'Рано или поздно пароль подберут, и хакер получит полный доступ к сайту.',
  def:'Лимит попыток с одного адреса, растущая задержка, капча, блокировка после N ошибок, двухфакторная аутентификация и длинные уникальные пароли.',
  fix:'if (failed_attempts(ip) > 5) {\n  block(ip, minutes = 15)\n}\nrequire_2fa(user)' },

{ type:'defend', topic:'Хранение паролей', title:'Утечка базы',
  text:'База пользователей утекла в интернет. Пароли в ней лежали открытым текстом. Как надо было их хранить?',
  log:'id | login   | password\n 1 | anna    | Kotik2010\n 2 | maks    | 12345678\n 3 | admin   | Adm!n_2024',
  opts:[
    ['Хранить только медленный хэш с солью (bcrypt или Argon2)', true],
    ['Закодировать пароли в Base64', false],
    ['Хэшировать MD5 без соли', false],
    ['Переложить пароли в отдельную таблицу', false] ],
  hack:'Хакеру даже не нужно ничего писать: он просто читает таблицу и пробует эти пароли на других сайтах.',
  why:'Пароли хранились как есть. Base64 это не шифрование, он раскодируется за секунду. MD5 считается так быстро, что миллиарды вариантов перебираются за минуты.',
  res:'Украдены все аккаунты. Люди часто используют один пароль везде, поэтому пострадают и их почта, и соцсети.',
  def:'Сохранять только результат медленной хэш-функции с уникальной солью. При входе хэшировать введённый пароль и сравнивать хэши. Сам пароль сервер не хранит.',
  fix:'hash = bcrypt.hash(password, cost = 12)\n# при входе:\nbcrypt.verify(entered, hash)' },

{ type:'spot', topic:'SQL-инъекция', title:'Код-ревью: форма входа',
  text:'Найди строку, через которую хакер может войти без пароля. Нажми на неё.',
  code:['username = form["login"]','password = form["password"]','query = "SELECT * FROM users WHERE login=\'" + username + "\' AND pass=\'" + password + "\'"','user = db.execute(query)','if user: allow_login()'],
  answer:2,
  hack:"В поле логина хакер пишет:  admin' --",
  why:"Ввод склеивается прямо с текстом запроса. Получается  WHERE login='admin' --' AND pass='…'. Два минуса в SQL начинают комментарий, и проверка пароля просто отрезается.",
  res:'Вход под администратором без пароля. Похожим приёмом можно прочитать или удалить всю базу.',
  def:'Никогда не склеивать SQL с вводом пользователя. Использовать параметризованные запросы: база получает данные отдельно от команды и не выполняет их как код.',
  fix:'db.execute(\n  "SELECT * FROM users WHERE login = ?",\n  (username,)\n)\n# пароль проверять через bcrypt.verify' },

{ type:'defend', topic:'SQL-инъекция', title:'Странный ввод в поиске',
  text:"В поле поиска товаров кто-то ввёл  ' OR '1'='1  и сайт показал все скрытые товары и заказы. Как исправить?",
  log:"GET /search?q=' OR '1'='1\nSQL: SELECT * FROM goods WHERE name = '' OR '1'='1'\n→ возвращено 18 233 строки (включая скрытые)",
  opts:[
    ['Перейти на параметризованные запросы во всём коде', true],
    ['Удалять из ввода слово OR', false],
    ['Запретить в поиске кавычки, но только на главной странице', false],
    ['Увеличить максимальную длину поля поиска', false] ],
  hack:"' OR '1'='1",
  why:"Условие '1'='1' всегда истинно, поэтому WHERE пропускает все строки таблицы.",
  res:'Утечка всех данных, включая чужие заказы, адреса и телефоны.',

let i = 0, hp = 100, pts = 0, results = [];
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function setBar(){
  $('num').textContent = Math.min(i+1, MISSIONS.length) + '/' + MISSIONS.length;
  $('pts').textContent = pts;
  const el = $('hp'); el.style.width = hp + '%';
  el.style.background = hp > 50 ? 'var(--shield)' : hp > 25 ? 'var(--alert)' : 'var(--breach)';
  $('hpm').setAttribute('aria-valuenow', hp);
}

/* ---------- sound ---------- */
let ac = null;
function beep(f, d, type='sine', vol=.06){
  try {
    if (!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
    const t0 = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0+d);
    o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0+d+.02);
  } catch(e) {}
}

function show(){
  setBar();
  const m = MISSIONS[i];
  const tagName = { defend:'Атака', spot:'Код-ревью', phish:'Почта' }[m.type];
  let body = '';
  if (m.type === 'defend'){
    const opts = m.opts.map((o,k) => ({ t:o[0], ok:o[1], k })).sort(() => Math.random() - .5);
    body = `<div class="term"><div class="hd">журнал</div><pre>${esc(m.log)}</pre></div>
      <div class="opts">${opts.map((o,n) => `<button class="opt" data-ok="${o.ok}"><span class="k">${'ABCD'[n]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>`;
  } else if (m.type === 'spot'){
    body = `<div class="term"><div class="hd">server.py</div><div class="lines">${m.code.map((l,n) =>
      `<button class="ln" data-n="${n}"><span>${n+1}</span>${esc(l)}</button>`).join('')}</div></div>`;
  } else {
    const ml = m.mail;
    body = `<div class="mail"><div class="mh"><div><b>От:</b> ${esc(ml.from)}</div><div><b>Тема:</b> ${esc(ml.subj)}</div></div>
      <div class="mb">${ml.body.map(p => `<p>${esc(p)}</p>`).join('')}<span class="lnk">${esc(ml.link)}</span></div></div>
      <div class="two"><button class="opt" data-v="phish"><span>🎣 Фишинг</span></button><button class="opt" data-v="legit"><span>✓ Настоящее</span></button></div>`;
  }
  app.innerHTML = `<div class="card" id="mc">
    <span class="tag ${m.type}">${tagName} · ${esc(m.topic)}</span>
    <h1>${esc(m.title)}</h1>
    <p class="muted">${esc(m.text)}</p>
    ${body}
  </div><div id="after"></div>`;
  window.scrollTo(0,0);

  if (m.type === 'defend') app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const ok = b.dataset.ok === 'true';
    app.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.ok === 'true') x.classList.add('right'); });
    if (!ok) b.classList.add('wrong');
    resolve(ok);
  });
  if (m.type === 'spot') app.querySelectorAll('.ln').forEach(b => b.onclick = () => {
    const ok = +b.dataset.n === m.answer;
    app.querySelectorAll('.ln').forEach(x => { x.disabled = true; if (+x.dataset.n === m.answer) x.classList.add('right'); });
    if (!ok) b.classList.add('wrong');
    resolve(ok);
  });
  if (m.type === 'phish') app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const ok = b.dataset.v === m.answer;
    app.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.v === m.answer) x.classList.add('right'); });
    if (!ok) b.classList.add('wrong');
    resolve(ok);
  });
}

function resolve(ok){
  const m = MISSIONS[i];
  results.push({ topic:m.topic, title:m.title, ok, def:m.def });
  if (ok){ pts += 100; beep(660,.12); setTimeout(()=>beep(990,.18),100); }
  else { hp = Math.max(0, hp - 25); beep(160,.35,'sawtooth',.05); $('mc').classList.add('shake'); try { navigator.vibrate && navigator.vibrate(100); } catch(e) {} }
  setBar();
  const last = i === MISSIONS.length - 1 || hp <= 0;
  $('after').innerHTML = `
  <div class="card">
    <div class="verdict ${ok ? 'ok' : 'bad'}">
      <div>${ok ? 'Атака отражена' : 'Защита пробита: −25%'}
      <small>${ok ? '+100 очков' : 'Правильный ответ подсвечен зелёным. Прочитай разбор.'}</small></div>
    </div>
    <div class="deb">
      <section><h3 class="h-hack">Что написал хакер</h3><div class="term"><pre>${esc(m.hack)}</pre></div></section>
      <section><h3 class="h-why">Почему это сработало</h3><p>${esc(m.why)}</p></section>
      <section><h3 class="h-res">Что будет без защиты</h3><p>${esc(m.res)}</p></section>
      <section><h3 class="h-def">Как защищаться</h3><p>${esc(m.def)}</p><div class="term"><div class="hd">правильно</div><pre>${esc(m.fix)}</pre></div></section>
    </div>
    <button class="btn" id="next">${last ? 'Итоги дежурства' : 'Следующий инцидент →'}</button>
  </div>`;
  $('after').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start' });
  $('next').onclick = () => { if (last) finish(); else { i++; show(); } };
}

function finish(){
  const right = results.filter(r => r.ok).length;
  const hacked = hp <= 0;
  const rank = hacked ? 'Сервер взломан' : right === MISSIONS.length ? 'Эксперт по безопасности' : right >= 9 ? 'Аналитик SOC' : right >= 6 ? 'Младший аналитик' : 'Стажёр';
  let best = 0; try { best = +localStorage.getItem('kibershchit-best') || 0; } catch(e) {}
  if (pts > best){ best = pts; try { localStorage.setItem('kibershchit-best', pts); } catch(e) {} }
  app.innerHTML = `
  <div class="card">
    <h2>Итоги дежурства</h2>
    <div class="big" style="color:${hacked ? 'var(--breach)' : 'var(--shield)'}">${right}/${results.length}</div>
    <h1>${rank}</h1>
    <p class="muted">Очки: ${pts} · рекорд: ${best} · защита сервера: ${hp}%${hacked && results.length < MISSIONS.length ? ` · пройдено инцидентов: ${results.length} из ${MISSIONS.length}` : ''}</p>
  </div>
  <div class="card">
    <h2>Шпаргалка защитника</h2>
    <div class="recap">${results.map(r => `<div><b style="color:${r.ok ? 'var(--shield)' : 'var(--breach)'}">${r.ok ? '✓' : '✗'}</b><span><b style="width:auto;font-family:var(--body)">${esc(r.topic)}:</b> ${esc(r.def)}</span></div>`).join('')}</div>
  </div>
  <button class="btn" id="again">Новое дежурство</button>
  <button class="btn ghost" id="toWs">⌨ Теперь напиши защиту сам: Мастерская</button>`;
  window.scrollTo(0,0);
  $('again').onclick = () => { i = 0; hp = 100; pts = 0; results = []; show(); };
  $('toWs').onclick = workshop;
}

/* Каждый тест — это атака или проверка. Тесты запускаются вместе с кодом игрока в отдельном Web Worker. */
const TASKS = [
{ id:'xss', topic:'XSS', title:'Экранирование HTML',
  task:'Комментарии вставляются в страницу как HTML, поэтому хакер может прислать <script> и украсть сессии. Напиши escapeHtml(text): функция должна заменить опасные символы на HTML-сущности.',
  starter:
`// Замени опасные символы:
//   &  →  &amp;
//   <  →  &lt;
//   >  →  &gt;
//   "  →  &quot;
//   '  →  &#39;
function escapeHtml(text) {
  return text; // сейчас текст вставляется как есть: это уязвимость
}`,
  hint:'Используй text.replace(/</g, "&lt;") для каждого символа. Заменяй & самым первым, иначе испортишь уже сделанные замены.',
  tests:[
    { n:'Атака: <script>alert(1)<\/script>', f:() => escapeHtml("<script>alert(1)</" + "script>") === "&lt;script&gt;alert(1)&lt;/script&gt;" },
    { n:'Атака через атрибут: " onmouseover="…', f:() => escapeHtml('" onmouseover="steal()') === '&quot; onmouseover=&quot;steal()' },
    { n:"Одинарные кавычки: it's", f:() => escapeHtml("it's") === "it&#39;s" },
    { n:'Амперсанд: a & b', f:() => escapeHtml("a & b") === "a &amp; b" },
    { n:'& заменяется первым: &lt; → &amp;lt;', f:() => escapeHtml("&lt;") === "&amp;lt;" },
    { n:'Обычный текст не испорчен', f:() => escapeHtml("Привет, мир! 2+2=4") === "Привет, мир! 2+2=4" }
  ],
  solution:
`function escapeHtml(text) {
  return text
    .replace(/&/g, "&amp;")   // первым, иначе сломаем следующие замены
    .replace(/</g, "&lt;")    // теперь браузер не увидит начало тега
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")  // защищает значения атрибутов
    .replace(/'/g, "&#39;");
}`,
  py:
`import html
safe = html.escape(text, quote=True)  # в Python это уже есть в стандартной библиотеке`,
  why:'Браузер видит &lt;script&gt; как обычный текст «<script>» и не запускает его. В реальных проектах используют готовые функции: textContent в JavaScript, автоэкранирование в шаблонах (Jinja2, React) и html.escape в Python.' },

`// Пароль надёжный, если:
//   • длина не меньше 12 символов
//   • есть строчная латинская буква (a-z)
//   • есть заглавная латинская буква (A-Z)
//   • есть цифра (0-9)
//   • есть спецсимвол (всё, что не буква и не цифра)
function isStrongPassword(pw) {
  return pw.length > 0; // сейчас подходит любой пароль
}`,
  hint:'Проверяй каждое правило отдельно через регулярные выражения: /[a-z]/.test(pw), /[A-Z]/.test(pw), /[0-9]/.test(pw), /[^A-Za-z0-9]/.test(pw).',
  tests:[
    { n:'Отклонён «123456»', f:() => isStrongPassword("123456") === false },
    { n:'Отклонён «password»', f:() => isStrongPassword("password") === false },
    { n:'Отклонён короткий «Qw3rty!»', f:() => isStrongPassword("Qw3rty!") === false },
    { n:'Отклонён без спецсимвола «Kotik2010Kotik»', f:() => isStrongPassword("Kotik2010Kotik") === false },
    { n:'Отклонён без строчных «ALLCAPS-12345678»', f:() => isStrongPassword("ALLCAPS-12345678") === false },
    { n:'Отклонён без цифр «Moy-Ryzhiy-Kot!»', f:() => isStrongPassword("Moy-Ryzhiy-Kot!") === false },
    { n:'Принят «Moy-Kot-Ryzhik-2024»', f:() => isStrongPassword("Moy-Kot-Ryzhik-2024") === true },
    { n:'Принят «Zebra#Tea7Rocket»', f:() => isStrongPassword("Zebra#Tea7Rocket") === true }
  ],
  solution:
`function isStrongPassword(pw) {
  if (pw.length < 12) return false;            // короткие перебираются быстро
  if (!/[a-z]/.test(pw)) return false;         // строчная буква
  if (!/[A-Z]/.test(pw)) return false;         // заглавная буква
  if (!/[0-9]/.test(pw)) return false;         // цифра
  if (!/[^A-Za-z0-9]/.test(pw)) return false;  // спецсимвол
  return true;
}`,
  py:
`import re
def is_strong_password(pw):
    return (len(pw) >= 12 and re.search(r"[a-z]", pw)
            and re.search(r"[A-Z]", pw) and re.search(r"[0-9]", pw)
            and re.search(r"[^A-Za-z0-9]", pw)) is not None`,
  why:'Каждый символ длины умножает число вариантов для перебора, поэтому длина важнее всего. В реальных сервисах пароль ещё сверяют со списками утёкших паролей и обязательно включают двухфакторный вход.' },

{ id:'limit', topic:'Брутфорс', title:'Лимит попыток входа',
  task:'Хакер перебирает тысячи паролей в минуту. Напиши createLimiter(max): функция создаёт счётчик, который разрешает с одного IP не больше max попыток.',
  starter:
`// createLimiter(max) возвращает функцию allow(ip).
// allow(ip) должна возвращать true, пока с этого ip
// было не больше max попыток, а потом false.
// У каждого ip свой счётчик.
function createLimiter(max) {
  return function allow(ip) {
    return true; // сейчас можно пробовать бесконечно
  };
}`,
  hint:'Создай объект const attempts = {} внутри createLimiter. В allow увеличивай attempts[ip] на 1 (сначала там undefined, поэтому пиши (attempts[ip] || 0) + 1) и возвращай attempts[ip] <= max.',
  tests:[
    { n:'Первые 5 попыток разрешены (max = 5)', f:() => { const a = createLimiter(5); let ok = true; for (let k = 0; k < 5; k++) ok = a("10.0.0.1") === true && ok; return ok; } },
    { n:'6-я попытка заблокирована', f:() => { const a = createLimiter(5); for (let k = 0; k < 5; k++) a("10.0.0.1"); return a("10.0.0.1") === false; } },
    { n:'Брутфорс: из 1000 попыток прошли только 5', f:() => { const a = createLimiter(5); let n = 0; for (let k = 0; k < 1000; k++) if (a("6.6.6.6")) n++; return n === 5; } },
    { n:'Другой IP не блокируется из-за чужих попыток', f:() => { const a = createLimiter(3); for (let k = 0; k < 10; k++) a("6.6.6.6"); return a("10.0.0.2") === true; } },
    { n:'У разных лимитеров свои счётчики', f:() => { const a = createLimiter(1), b = createLimiter(1); a("1.1.1.1"); return b("1.1.1.1") === true; } }
  ],
  solution:
`function createLimiter(max) {
  const attempts = {};                        // ip → число попыток
  return function allow(ip) {
    attempts[ip] = (attempts[ip] || 0) + 1;   // считаем попытку
    return attempts[ip] <= max;               // больше max: блок
  };
}`,
  py:
`from collections import defaultdict
def create_limiter(max_tries):
    attempts = defaultdict(int)
    def allow(ip):
        attempts[ip] += 1
        return attempts[ip] <= max_tries
    return allow`,
  why:'При лимите 5 попыток хакеру понадобятся годы, а не минуты. В реальных системах счётчик ещё сбрасывают со временем (например, раз в 15 минут), хранят его в Redis и добавляют капчу и двухфакторный вход.' },

{ id:'path', topic:'Path traversal', title:'Безопасное имя файла',
  task:'Сервис отдаёт файлы по имени, и запрос ../../etc/passwd читает системные файлы. Напиши safeFileName(name): функция возвращает имя, если оно безопасное, иначе null.',
  starter:
`// Безопасное имя:
//   • только латинские буквы, цифры, точка, дефис и _
//   • длина от 1 до 100
//   • нет ".." (выход в папку выше)
//   • не начинается с точки (скрытые файлы вроде .env)
// Иначе верни null.
function safeFileName(name) {
  return name; // сейчас пропускается всё, даже ../../etc/passwd
}`,
  hint:'Сначала проверь регуляркой /^[A-Za-z0-9._-]{1,100}$/ (так сразу отсекаются / и \\), потом name.includes("..") и name.startsWith(".").',
  tests:[
    { n:'Атака ../../etc/passwd → null', f:() => safeFileName("../../etc/passwd") === null },
    { n:'Атака ..\\..\\windows\\win.ini → null', f:() => safeFileName("..\\..\\windows\\win.ini") === null },
    { n:'Абсолютный путь /etc/passwd → null', f:() => safeFileName("/etc/passwd") === null },
    { n:'Скрытый файл .env с паролями → null', f:() => safeFileName(".env") === null },
    { n:'Хитрая атака report..pdf/../x → null', f:() => safeFileName("report..pdf/../x") === null },
    { n:'Пустое имя → null', f:() => safeFileName("") === null },
    { n:'Обычный файл report.pdf проходит', f:() => safeFileName("report.pdf") === "report.pdf" },
    { n:'photo_2024-01.jpg проходит', f:() => safeFileName("photo_2024-01.jpg") === "photo_2024-01.jpg" }
  ],
  solution:
`function safeFileName(name) {
  // белый список символов: / и \\ сюда не входят
  if (!/^[A-Za-z0-9._-]{1,100}$/.test(name)) return null;
  if (name.includes("..")) return null;    // выход из папки
  if (name.startsWith(".")) return null;   // скрытые файлы
  return name;
}`,
  py:
`import os
def safe_path(base, name):
    path = os.path.realpath(os.path.join(base, name))
    if not path.startswith(os.path.realpath(base) + os.sep):
        return None   # путь вышел за пределы папки
    return path`,
  why:'Белый список (разрешено только то, что точно безопасно) надёжнее чёрного: хакер не сможет придумать символ, о котором ты забыл. Вторая линия защиты: проверить, что итоговый путь остаётся внутри разрешённой папки (пример на Python).' },

{ id:'link', topic:'Фишинг', title:'Проверка ссылки из письма',
  task:'Фишинговые письма ведут на домены вроде bank.ru.evil.top. Напиши isTrustedLink(url): функция доверяет только https-ссылкам на bank.ru и его поддомены.',
  starter:
`// Доверяем, если:
//   • протокол https:
//   • домен ровно bank.ru или заканчивается на .bank.ru
// Если строка не ссылка, верни false (а не ошибку).
// Подсказка: new URL(url).hostname и .protocol
function isTrustedLink(url) {
  return url.includes("bank.ru"); // хакер легко обманет такую проверку
}`,
  hint:'Оберни разбор в try { const u = new URL(url); … } catch { return false; }. Проверь u.protocol === "https:" и (u.hostname === "bank.ru" || u.hostname.endsWith(".bank.ru")).',
  tests:[
    { n:'https://bank.ru/login: доверяем', f:() => isTrustedLink("https://bank.ru/login") === true },
    { n:'https://online.bank.ru: доверяем', f:() => isTrustedLink("https://online.bank.ru/pay") === true },
    { n:'Атака: https://bank.ru.evil.top/login', f:() => isTrustedLink("https://bank.ru.evil.top/login") === false },
    { n:'Атака: https://evil-bank.ru', f:() => isTrustedLink("https://evil-bank.ru") === false },
    { n:'Атака: https://bank.ru@evil.top (настоящий домен evil.top)', f:() => isTrustedLink("https://bank.ru@evil.top/") === false },
    { n:'Атака: https://evil.top/?go=bank.ru', f:() => isTrustedLink("https://evil.top/?go=bank.ru") === false },
    { n:'Без шифрования http://bank.ru: не доверяем', f:() => isTrustedLink("http://bank.ru") === false },
    { n:'Не ссылка → false без ошибки', f:() => isTrustedLink("просто текст") === false }
  ],
  solution:
`function isTrustedLink(url) {
  try {
    const u = new URL(url);                       // разбираем ссылку
    if (u.protocol !== "https:") return false;    // только шифрование
    return u.hostname === "bank.ru" ||
           u.hostname.endsWith(".bank.ru");       // точка важна!
  } catch {
    return false;                                 // это вообще не ссылка
  }
}`,
  py:
`from urllib.parse import urlparse
def is_trusted_link(url):
    u = urlparse(url)
    host = u.hostname or ""
    return u.scheme == "https" and (host == "bank.ru" or host.endswith(".bank.ru"))`,
  why:'Проверка «содержит bank.ru» ломается на bank.ru.evil.top и evil.top/?go=bank.ru. Ссылку надо разобрать стандартным парсером и сравнивать именно домен. Точка в «.bank.ru» не даёт пройти домену evil-bank.ru.' }

/* ---------- Песочница: код игрока выполняется в отдельном Web Worker ---------- */
const WORKER_SRC = `self.onmessage = function (e) {
  var code = e.data.code, tests = e.data.tests, outs = e.data.outs, res = [];
  try { new Function(code); } catch (err) { self.postMessage({ syntax: String(err.message || err) }); return; }
  function show(v) {
    if (v === undefined) return "undefined";
    if (typeof v === "string") return JSON.stringify(v);
    try { return JSON.stringify(v); } catch (x) { return String(v); }
  }
  for (var k = 0; k < tests.length; k++) {
    var r = { ok: false, out: "" };
    try { r.ok = new Function(code + "\\n;return (" + tests[k] + ")();")() === true; }
    catch (err) { r.err = String(err && err.message || err); }
    try { r.out = show(new Function(code + "\\n;return (" + outs[k] + ")();")()); }
    catch (err) { r.out = "Error: " + String(err && err.message || err); }
    if (r.out.length > 140) r.out = r.out.slice(0, 140) + "…";
    res.push(r);
  }
  self.postMessage({ results: res });
};`;
let workerUrl = null;
function runTests(code, tests, attacks){
  return new Promise(res => {
    try {
      if (!workerUrl) workerUrl = URL.createObjectURL(new Blob([WORKER_SRC], { type:'text/javascript' }));
      const w = new Worker(workerUrl);
      const to = setTimeout(() => { w.terminate(); res({ timeout:true }); }, 3000);
      w.onmessage = e => { clearTimeout(to); w.terminate(); res(e.data); };
      w.onerror = e => { clearTimeout(to); w.terminate(); res({ syntax: e.message || 'ошибка' }); e.preventDefault(); };
      w.postMessage({ code, tests: tests.map(t => String(t.f)), outs: attacks.map(a => String(a.o)) });
    } catch (err) { res({ syntax: String(err.message || err) }); }
  });
}

/* ---------- Подсветка синтаксиса JavaScript ---------- */
const KW = /^(function|return|const|let|var|if|else|for|while|try|catch|new|throw|of|in|typeof)$/;
function highlight(src){
  const re = /(\/\/[^\n]*)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|\b([A-Za-z_$][\w$]*)\b|\b(\d+)\b/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))){
    out += esc(src.slice(last, m.index));
    if (m[1]) out += `<span class="t-com">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="t-str">${esc(m[2])}</span>`;
    else if (m[3]) out += KW.test(m[3]) ? `<span class="t-kw">${m[3]}</span>` : /^(true|false|null|undefined)$/.test(m[3]) ? `<span class="t-num">${m[3]}</span>` : m[3];
    else out += `<span class="t-num">${m[4]}</span>`;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last)) + '\n';
}

const PRIO_CLS = { 'Блокер':'p-block', 'Критический':'p-crit', 'Высокий':'p-high' };

function workshop(){
  $('bar').hidden = true;
  const doneCount = TASKS.filter(t => wsStore.get('done-' + t.id)).length;
  app.innerHTML = `
  <button class="back" id="home">← В меню</button>
  <div class="card">
    <span class="tag spot">Мастерская · смена в отделе безопасности</span>
    <h1>Очередь задач</h1>
    <p class="muted">Ты разработчик в команде безопасности. Каждая задача пришла из баг-трекера: исследователи и мониторинг нашли уязвимость. Открой тикет, исправь код в редакторе и задеплой. После деплоя хакер атакует сервер, и ты увидишь, что на самом деле вернул твой код.</p>
    <p class="muted">Закрыто: <b style="color:var(--text)">${doneCount} из ${TASKS.length}</b></p>
  </div>
  <div class="tasks">${TASKS.map((t,k) => { const tk = TICKETS[t.id], d = wsStore.get('done-' + t.id); return `
    <button class="task ${d ? 'done' : ''}" data-k="${k}">
      <span class="tk">${tk.key}</span>
      <span class="tmid"><b>${esc(t.title)}</b><small>${esc(tk.svc)} · ${esc(t.topic)}</small></span>
      <span class="pill ${d ? 'p-done' : PRIO_CLS[tk.prio]}">${d ? 'Закрыт' : esc(tk.prio)}</span>
    </button>`; }).join('')}</div>`;
  window.scrollTo(0,0);
  $('home').onclick = intro;
  app.querySelectorAll('.task').forEach(b => b.onclick = () => openTask(+b.dataset.k));
}

const sleep = ms => new Promise(r => setTimeout(r, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : ms));

function openTask(k){
  const T = TASKS[k], TK = TICKETS[T.id], AT = ATTACKS[T.id];
  let fails = 0, busy = false;
  app.innerHTML = `
  <button class="back" id="toList">← Очередь задач</button>
  <div class="card ticket">
    <div class="trow"><span class="tk">${TK.key}</span><span class="pill ${PRIO_CLS[TK.prio]}">${esc(TK.prio)}</span><span class="muted" style="font-size:12px">${esc(TK.svc)}</span></div>
    <h1>${esc(T.title)}</h1>
    <dl class="meta">
      <dt>Источник</dt><dd>${esc(TK.reporter)}</dd>
      <dt>Файл</dt><dd class="mono">${esc(TK.file)}</dd>
      <dt>Ущерб</dt><dd>${esc(TK.impact)}</dd>
    </dl>
    <div><h3 class="sub">Шаги воспроизведения</h3><ol class="steps">${TK.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol></div>
    <div><h3 class="sub">Что сделать</h3><p>${esc(T.task)}</p></div>
    <details><summary>Критерии приёмки (${T.tests.length})</summary><ul class="accept">${T.tests.map(t => `<li>${esc(t.n)}</li>`).join('')}</ul></details>
  </div>

  <div class="ide">
    <div class="tabs"><span class="tab on">${esc(TK.file.split('/').pop())}</span><span class="path">${esc(TK.file)}</span></div>
    <div class="ed">
      <div class="gut" id="gut" aria-hidden="true"></div>
      <div class="area">
        <pre class="hl" id="hl" aria-hidden="true"></pre>
        <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Редактор кода"></textarea>
      </div>
    </div>
    <div class="keys" id="keys">${['{','}','(',')','[',']',';','"',"'",'=','<','>','/','\\','.','!','&&','||','return ','  '].map(s =>
      `<button data-s="${esc(s)}">${s === '  ' ? '⇥' : esc(s.trim() || s)}</button>`).join('')}</div>
    <div class="sbar"><span id="pos">Ln 1, Col 1</span><span>JavaScript · UTF-8</span><span id="dirty">● не сохранено в git</span></div>
  </div>

  <div class="row2">
    <button class="btn" id="check">⇪ Commit &amp; Deploy</button>
    <button class="btn ghost" id="reset">git checkout</button>
  </div>
  <button class="btn ghost" id="help">💡 Спросить у тимлида</button>
  <div id="hintBox"></div>
  <div id="res"></div>`;
  window.scrollTo(0,0);

  const ta = $('code'), hl = $('hl'), gut = $('gut');
  ta.value = wsStore.get('code-' + T.id) || T.starter;
  function paint(){
    hl.innerHTML = highlight(ta.value);
    const n = ta.value.split('\n').length;
    gut.innerHTML = Array.from({ length:n }, (_, i) => i + 1).join('<br>');
    sync();
  }
  function sync(){
    hl.style.transform = `translate(${-ta.scrollLeft}px, ${-ta.scrollTop}px)`;
    gut.style.transform = `translateY(${-ta.scrollTop}px)`;
  }
  function pos(){
    const before = ta.value.slice(0, ta.selectionStart).split('\n');
    $('pos').textContent = `Ln ${before.length}, Col ${before[before.length-1].length + 1}`;
  }
  ta.addEventListener('input', () => { wsStore.set('code-' + T.id, ta.value); $('dirty').hidden = false; paint(); pos(); });
  ta.addEventListener('scroll', sync);
  ['keyup','click','select'].forEach(ev => ta.addEventListener(ev, pos));
  ta.addEventListener('keydown', e => { if (e.key === 'Tab'){ e.preventDefault(); insert('  '); } });
  function insert(s){
    ta.focus();
    ta.setRangeText(s, ta.selectionStart, ta.selectionEnd, 'end');
    ta.dispatchEvent(new Event('input'));
  }
  $('keys').querySelectorAll('button').forEach(b => {
    b.addEventListener('pointerdown', e => e.preventDefault());
    b.onclick = () => insert(b.dataset.s);
  });
  paint();
  $('dirty').hidden = !wsStore.get('code-' + T.id);

  $('toList').onclick = workshop;
  $('reset').onclick = () => { ta.value = T.starter; wsStore.set('code-' + T.id, ta.value); paint(); $('res').innerHTML = ''; };
  $('help').onclick = () => {
    const showSol = fails >= 2;
    $('hintBox').innerHTML = `<div class="chat"><b>Тимлид</b><p>${showSol ? 'Давай разберём вместе. Вот как бы я написал:' : esc(T.hint)}</p>
      ${showSol ? `<div class="term"><pre>${esc(T.solution)}</pre></div>` : '<p class="muted" style="font-size:13px">После двух неудачных деплоев тимлид покажет готовое решение.</p>'}</div>`;
  };

  $('check').onclick = async () => {
    if (busy) return; busy = true;
    $('check').disabled = true;
    const res = $('res');
    const short = Math.random().toString(16).slice(2, 9);
    res.innerHTML = `<div class="console"><div class="chead"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span>CI / CD · ${esc(TK.svc)}</span></div><div class="cbody" id="cb"></div></div>`;
    res.scrollIntoView({ behavior:'smooth', block:'start' });
    const cb = $('cb');
    const line = (html, cls='') => { const d = document.createElement('div'); d.className = 'cl ' + cls; d.innerHTML = html; cb.appendChild(d); cb.scrollTop = cb.scrollHeight; return d; };

    line(`<span class="pr">dev@laptop:~/${esc(TK.svc)}$</span> git commit -am "fix(security): ${TK.key} ${esc(T.title.toLowerCase())}"`);
    await sleep(350);
    line(`[fix/${TK.key.toLowerCase()} ${short}] 1 file changed`, 'dim');
    await sleep(300);
    line(`<span class="pr">dev@laptop:~/${esc(TK.svc)}$</span> git push && ci run`);
    await sleep(400);
    const lint = line('▸ lint: проверка синтаксиса…', 'dim');
    const r = await runTests(ta.value, T.tests, AT);
    await sleep(350);

    if (r.syntax || r.timeout){
      fails++;
      lint.innerHTML = `✗ ${r.timeout ? 'тесты зависли (таймаут 3 с): похоже на бесконечный цикл' : 'lint: SyntaxError'}`;
      lint.className = 'cl bad';
      if (r.syntax) line(esc(r.syntax), 'bad');
      line('Пайплайн остановлен. Деплой отменён: сломанный код не попадёт на сервер.', 'dim');
      beep(160,.3,'sawtooth',.05);
      finishRun(false, 0, r);
      return;
    }
    lint.innerHTML = '✓ lint: ок'; lint.className = 'cl ok';
    await sleep(250);
    line(`✓ build: ${esc(TK.svc)}:${short}`, 'ok');
    await sleep(300);
    line(`✓ deploy → staging.${esc(TK.svc)}.local`, 'ok');
    await sleep(400);
    line('', '');
    line('━━━ ПЕНТЕСТ: хакер начинает атаку ━━━', 'warn');
    await sleep(350);

    let passed = 0;
    for (let n = 0; n < T.tests.length; n++){
      const x = r.results[n], a = AT[n];
      line(`<span class="pr hk">attacker@evil:~$</span> ${esc(a.req)}`);
      await sleep(260);
      line(`  ← твой код вернул: <span class="val">${esc(x.out)}</span>`, 'dim');
      await sleep(180);
      line(`  ${x.ok ? '✓' : '✗'} ${esc(T.tests[n].n)}${x.err ? ` (ошибка: ${esc(x.err)})` : ''}`, x.ok ? 'ok' : 'bad');
      if (x.ok){ passed++; beep(520 + n*40,.05,'square',.02); } else beep(150,.12,'sawtooth',.04);
      await sleep(220);
    }
    const all = passed === T.tests.length;
    line('', '');
    line(all ? `━━━ Все ${passed} атак отражены. Можно в прод. ━━━` : `━━━ Пройдено ${passed} из ${T.tests.length}. Уязвимость осталась, откат деплоя. ━━━`, all ? 'ok' : 'bad');
    if (!all) fails++;
    finishRun(all, passed, r);
  };

  function finishRun(all, passed){
    busy = false;
    $('check').disabled = false;
    const box = document.createElement('div');
    if (all){
      wsStore.set('done-' + T.id, '1');
      $('dirty').hidden = true;
      beep(660,.12); setTimeout(() => beep(990,.2), 100);
      box.innerHTML = `<div class="card">
        <div class="verdict ok"><div>${TK.key} закрыт<small>Исправление выкачено в прод. Код-ревью пройдено.</small></div></div>
        <div class="deb">
          <section><h3 class="h-def">Решение тимлида для сравнения</h3><div class="term"><pre>${esc(T.solution)}</pre></div></section>
          <section><h3 class="h-why">Почему это защищает</h3><p>${esc(T.why)}</p></section>
          <section><h3 class="h-res">То же на Python</h3><div class="term"><pre>${esc(T.py)}</pre></div></section>
        </div>
        <button class="btn" id="nextTask">${k < TASKS.length - 1 ? 'Следующий тикет →' : 'К очереди задач'}</button>
      </div>`;
    } else {
      box.innerHTML = `<div class="card"><div class="verdict bad"><div>Тикет остаётся открытым<small>Посмотри в логе, какие атаки прошли и что вернул твой код, исправь и задеплой снова.</small></div></div></div>`;
    }
    $('res').appendChild(box);
    const nb = $('nextTask'); if (nb) nb.onclick = () => k < TASKS.length - 1 ? openTask(k+1) : workshop();
  }
}
intro();
})();
</script>
